name: ask

# Answers an issue titled "ask: <question>" from my portfolio's own Ask API (retrieval over the site's
# facts, no LLM) and closes it; any other issue is left alone. The title reaches the script through an
# environment variable, never inside the shell command, so it can't run as code.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ask-${{ github.event.issue.number }}

jobs:
  answer:
    # startsWith ignores case. The script decides what is an ask ("ask:", "ask :", "ask：") and
    # leaves any other title starting with "ask" alone.
    if: startsWith(github.event.issue.title, 'ask')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ask_issue.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
