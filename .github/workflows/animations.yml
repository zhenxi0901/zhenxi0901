name: animations

# Redraws the profile's animations every 6 hours onto the `animations` branch, which the README reads:
# the canary rollout and the terminal replay (scripts/animations.py: my real contributions, and what
# my site answers curl right now) and the snake, in my colours. The branch holds only the latest
# drawings: each run replaces it with a single commit, so it never grows.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/animations.py", ".github/workflows/animations.yml"]

permissions:
  contents: write

concurrency:
  group: animations
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Canary rollout and terminal replay
        run: python3 scripts/animations.py dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Snake, in my colours
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#c2f75c&color_dots=#161b22,#1a2e05,#3a5a0b,#6b9a14,#c2f75c
            dist/snake-light.svg?color_snake=#3f6212&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212

      - name: Publish to the animations branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b animations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Animations: canary rollout, terminal replay, snake"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" animations
          ls -la
