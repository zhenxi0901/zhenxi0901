name: contribution snake

# Redraw the contribution snake once a day, in the portfolio's colours, onto the `output` branch
# the README reads it from (the pattern from Platane/snk's own profile).
on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#c2f75c&color_dots=#161b22,#1f3008,#3f6212,#65a30d,#c2f75c
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
