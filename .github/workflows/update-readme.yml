name: update readme

# Refresh the open and merged pull requests and the portfolio's deploys every four hours, and whenever the
# script changes. Pushes made with GITHUB_TOKEN do not start new runs, so this cannot loop.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-readme.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/update_readme.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if anything changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: refresh live numbers, pull requests and deploys"
          git push
